<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nova Publicação - Mobile App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0B1120;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #1E293B;
    }

    /* Simulador de Aparelho iPhone */
    .device-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .device-frame {
      width: 390px;
      height: 844px;
      max-height: 94vh;
      background: #FFFFFF;
      border-radius: 48px;
      box-shadow: 
        0 0 0 12px #1E293B,
        0 0 0 14px #334155,
        0 30px 60px -12px rgba(0, 0, 0, 0.65),
        0 18px 36px -18px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Barra Superior iOS (Dynamic Island / Notch + Status Bar) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 6px 30px;
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      letter-spacing: -0.2px;
      background: #FFFFFF;
      user-select: none;
      z-index: 10;
    }

    .status-bar .time {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.1px;
    }

    .status-bar .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar svg {
      fill: #000000;
      display: block;
    }

    /* Header da Tela */
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px 14px;
      background: #FFFFFF;
    }

    .btn-close {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E293B;
      padding: 4px;
      border-radius: 50%;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-close:hover {
      background: #F1F5F9;
    }

    .btn-close:active {
      transform: scale(0.92);
    }

    .btn-close svg {
      width: 28px;
      height: 28px;
      stroke-width: 1.8;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
    }

    .header-spacer {
      width: 36px;
    }

    /* Área de Conteúdo */
    .main-content {
      flex: 1;
      padding: 12px 24px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .prompt-label {
      font-size: 16px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 16px;
      letter-spacing: -0.2px;
    }

    /* Caixa de Texto do Post */
    .input-box {
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      padding: 16px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus-within {
      border-color: #008CE3;
      box-shadow: 0 0 0 3px rgba(0, 140, 227, 0.12);
    }

    .input-box textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.45;
      color: #1E293B;
      background: transparent;
      min-height: 160px;
    }

    .input-box textarea::placeholder {
      color: #94A3B8;
      font-weight: 400;
    }

    /* Preview da Imagem Anexada */
    .image-preview-wrapper {
      display: none;
      position: relative;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      max-height: 140px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
    }

    .image-preview-wrapper img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .btn-remove-preview {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      border: none;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .char-count {
      text-align: right;
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      margin-top: 10px;
      user-select: none;
    }

    /* Chips de Ações Rápidas */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      outline: none;
    }

    .action-chip:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
    }

    .action-chip:active {
      transform: scale(0.97);
    }

    .action-chip svg {
      width: 18px;
      height: 18px;
      stroke: #0D9488;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.2s;
    }

    /* Estado ativo do Chip */
    .action-chip.active {
      background-color: #F0FDFA;
      border-color: #0D9488;
      color: #0F766E;
      font-weight: 600;
    }

    /* Botão Publicar */
    .btn-publish {
      width: 100%;
      height: 52px;
      background-color: #008CE3;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 28px;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(0, 140, 227, 0.35);
      user-select: none;
    }

    .btn-publish:hover {
      background-color: #007BC7;
      box-shadow: 0 6px 18px rgba(0, 140, 227, 0.42);
    }

    .btn-publish:active {
      transform: scale(0.98);
    }

    /* Barra Inferior (Bottom Navigation) */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #FFFFFF;
      border-top: 1px solid #F1F5F9;
      padding: 10px 16px 22px;
      user-select: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      color: #64748B;
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s;
      width: 68px;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: #64748B;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.2s;
    }

    .nav-item.active {
      color: #008CE3;
      font-weight: 600;
    }

    .nav-item.active svg {
      stroke: #008CE3;
    }

    /* Barra Home Indicator do iOS */
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4px;
      background: #000000;
      border-radius: 10px;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Modal / Toast de Sucesso */
    .toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Input oculto para upload de imagem */
    #file-input {
      display: none;
    }

    /* Tela secundária alternativa para teste das abas */
    .tab-content-view {
      display: none;
      flex: 1;
      padding: 30px 24px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tab-content-view h2 {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }

    .tab-content-view p {
      color: #64748B;
      font-size: 14px;
      max-width: 260px;
    }
  </style>
</head>
<body>

  <div class="device-wrapper">
    <div class="device-frame">
      
      <!-- Toast de Confirmação -->
      <div id="toast" class="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-text">Publicação enviada com sucesso!</span>
      </div>

      <!-- iOS Status Bar -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <!-- Sinal de Rede -->
          <svg width="18" height="12" viewBox="0 0 18 12">
            <rect x="0" y="8" width="3" height="4" rx="1"></rect>
            <rect x="5" y="6" width="3" height="6" rx="1"></rect>
            <rect x="10" y="3" width="3" height="9" rx="1"></rect>
            <rect x="15" y="0" width="3" height="12" rx="1"></rect>
          </svg>
          <!-- Wi-Fi -->
          <svg width="16" height="12" viewBox="0 0 16 12">
            <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"></path>
            <path d="M3.5 7a6.3 6.3 0 019 0" stroke="black" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
            <path d="M1 4a9.9 9.9 0 0114 0" stroke="black" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
          </svg>
          <!-- Bateria -->
          <svg width="24" height="12" viewBox="0 0 24 12">
            <rect x="0.5" y="0.5" width="20" height="11" rx="3.5" fill="none" stroke="black"></rect>
            <rect x="2" y="2" width="14" height="8" rx="2" fill="black"></rect>
            <path d="M22 4.5v3" stroke="black" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
        </div>
      </div>

      <!-- Header da Tela Nova Publicação -->
      <div id="new-post-header" class="screen-header">
        <button id="btn-close" class="btn-close" title="Fechar">
          <!-- Ícone de círculo com X exatamente como na imagem -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </button>
        <span class="header-title">Nova publicação</span>
        <div class="header-spacer"></div>
      </div>

      <!-- Área de Conteúdo Principal (Tela Criar) -->
      <div id="new-post-view" class="main-content">
        <h2 class="prompt-label">O que você está pensando?</h2>

        <div class="input-box">
          <textarea 
            id="post-input" 
            placeholder="Escreva algo..." 
            maxlength="280"
            rows="6"
          ></textarea>

          <!-- Preview de Imagem (quando carregada) -->
          <div id="image-preview-wrapper" class="image-preview-wrapper">
            <img id="image-preview" src="" alt="Foto anexada">
            <button id="btn-remove-preview" class="btn-remove-preview" title="Remover imagem">✕</button>
          </div>

          <div id="char-count" class="char-count">0/280</div>
        </div>

        <!-- Linha com os 3 Chips de Ação -->
        <div class="chips-row">
          <!-- 1. Imagem -->
          <button id="chip-image" class="action-chip" type="button">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span id="chip-image-text">Imagem</span>
          </button>
          <input type="file" id="file-input" accept="image/*">

          <!-- 2. Localização -->
          <button id="chip-location" class="action-chip" type="button">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s-7-5.333-7-11a7 7 0 1 1 14 0c0 5.667-7 11-7 11z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <span>Localização</span>
          </button>

          <!-- 3. Sentimento -->
          <button id="chip-mood" class="action-chip" type="button">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
            <span>Sentimento</span>
          </button>
        </div>

        <!-- Botão Publicar -->
        <button id="btn-publish" class="btn-publish" type="button">
          Publicar
        </button>
      </div>

      <!-- Visualização alternativa quando clicar em outras abas -->
      <div id="tab-alt-view" class="tab-content-view">
        <h2 id="tab-title">Início</h2>
        <p id="tab-desc">Você está na aba inicial. Clique em <strong>Criar</strong> para retornar à tela de publicação.</p>
      </div>

      <!-- Barra de Navegação Inferior (Bottom Navigation) -->
      <div class="bottom-nav">
        <!-- 1. Início -->
        <button class="nav-item" data-tab="home" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Início</span>
        </button>

        <!-- 2. Criar (Ativo na imagem) -->
        <button class="nav-item active" data-tab="create" type="button">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <span>Criar</span>
        </button>

        <!-- 3. Notificações -->
        <button class="nav-item" data-tab="notifications" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notificações</span>
        </button>

        <!-- 4. Perfil -->
        <button class="nav-item" data-tab="profile" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Perfil</span>
        </button>
      </div>

      <!-- Home bar inferior do iOS -->
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    const postInput = document.getElementById('post-input');
    const charCount = document.getElementById('char-count');
    const btnPublish = document.getElementById('btn-publish');
    const chipImage = document.getElementById('chip-image');
    const chipImageText = document.getElementById('chip-image-text');
    const chipLocation = document.getElementById('chip-location');
    const chipMood = document.getElementById('chip-mood');
    const fileInput = document.getElementById('file-input');
    const imagePreviewWrapper = document.getElementById('image-preview-wrapper');
    const imagePreview = document.getElementById('image-preview');
    const btnRemovePreview = document.getElementById('btn-remove-preview');
    const btnClose = document.getElementById('btn-close');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');

    const newPostHeader = document.getElementById('new-post-header');
    const newPostView = document.getElementById('new-post-view');
    const tabAltView = document.getElementById('tab-alt-view');
    const tabTitle = document.getElementById('tab-title');
    const tabDesc = document.getElementById('tab-desc');
    const navItems = document.querySelectorAll('.nav-item');

    // Contador de Caracteres em tempo real
    postInput.addEventListener('input', () => {
      const len = postInput.value.length;
      charCount.textContent = `${len}/280`;
    });

    // Toast de notificação
    function showNotification(msg, bg = '#10B981') {
      toastText.textContent = msg;
      toast.style.background = bg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Botão Fechar
    btnClose.addEventListener('click', () => {
      if (postInput.value.trim() !== '') {
        if (confirm('Deseja descartar a sua publicação?')) {
          postInput.value = '';
          charCount.textContent = '0/280';
          clearImage();
          showNotification('Rascunho descartado.', '#64748B');
        }
      } else {
        showNotification('Tela fechada.', '#64748B');
      }
    });

    // Chip Imagem & Seleção de Arquivo
    chipImage.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          imagePreview.src = ev.target.result;
          imagePreviewWrapper.style.display = 'block';
          chipImage.classList.add('active');
          chipImageText.textContent = 'Foto anexada';
          showNotification('Imagem adicionada com sucesso!');
        };
        reader.readAsDataURL(file);
      }
    });

    function clearImage() {
      fileInput.value = '';
      imagePreview.src = '';
      imagePreviewWrapper.style.display = 'none';
      chipImage.classList.remove('active');
      chipImageText.textContent = 'Imagem';
    }

    btnRemovePreview.addEventListener('click', (e) => {
      e.stopPropagation();
      clearImage();
      showNotification('Imagem removida.');
    });

    // Chip Localização
    chipLocation.addEventListener('click', () => {
      chipLocation.classList.toggle('active');
      if (chipLocation.classList.contains('active')) {
        showNotification('Localização: São Paulo, Brasil 📍');
      } else {
        showNotification('Localização removida.');
      }
    });

    // Chip Sentimento
    chipMood.addEventListener('click', () => {
      chipMood.classList.toggle('active');
      if (chipMood.classList.contains('active')) {
        showNotification('Sentimento: Sentindo-se inspirado 😊');
      } else {
        showNotification('Sentimento removido.');
      }
    });

    // Botão Publicar
    btnPublish.addEventListener('click', () => {
      const text = postInput.value.trim();
      const hasImage = imagePreview.src && imagePreviewWrapper.style.display !== 'none';

      if (!text && !hasImage) {
        showNotification('Por favor, escreva algo antes de publicar.', '#EF4444');
        postInput.focus();
        return;
      }

      showNotification('🎉 Publicação realizada com sucesso!');
      postInput.value = '';
      charCount.textContent = '0/280';
      clearImage();
      chipLocation.classList.remove('active');
      chipMood.classList.remove('active');
    });

    // Alternância de Abas na Barra Inferior
    const tabDetails = {
      home: { title: 'Feed Principal', desc: 'Acompanhe as publicações dos seus amigos e conexões.' },
      create: { title: 'Nova publicação', desc: '' },
      notifications: { title: 'Notificações', desc: 'Você não tem nenhuma notificação não lida no momento.' },
      profile: { title: 'Meu Perfil', desc: 'Gerencie suas postagens, fotos e informações de perfil.' }
    };

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const tabKey = item.getAttribute('data-tab');

        if (tabKey === 'create') {
          newPostHeader.style.display = 'flex';
          newPostView.style.display = 'flex';
          tabAltView.style.display = 'none';
        } else {
          newPostHeader.style.display = 'none';
          newPostView.style.display = 'none';
          tabAltView.style.display = 'flex';
          tabTitle.textContent = tabDetails[tabKey].title;
          tabDesc.textContent = tabDetails[tabKey].desc;
        }
      });
    });
  </script>
</body>
</html>
